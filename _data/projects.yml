          url: https://github.com/mboyanov/mboyanov.github.io/blob/master/_notebooks/2026-04-04-Practical-TurboQuant.ipynb
        - label: Notebook 2
          url: https://github.com/mboyanov/mboyanov.github.io/blob/master/_notebooks/2026-06-24-Practical-TurboQuant-2.ipynb
        - label: Inspector source
          url: https://huggingface.co/spaces/mboyanov/turboquant-inspect/tree/main
    - label: Write-up
      icon: book
      links:
